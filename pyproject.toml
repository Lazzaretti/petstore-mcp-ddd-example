[project]
name = "petstore"
version = "0.1.0"
description = "Petstore MCP demo: endpoint tools (before) vs. domain tools per bounded context (after)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.1.4",
    "uvicorn",
    "httpx2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["petstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # petstore_before.py lives in the repo root
addopts = "-m 'not integration'"
markers = ["integration: needs the running app over HTTP, Docker or Keycloak (run with -m integration)"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["spikes"]  # research spikes: kept as they were, for reading only

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
